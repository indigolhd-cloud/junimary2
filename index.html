const ds=document.getElementById("days"),app=document.getElementById("app");
function save(){localStorage.setItem("vocab_"+day,score)}
function menu(){ds.innerHTML="";ALL.forEach(d=>{let b=document.createElement("button");b.className="day "+(d===day?"on ":"")+(DATA[d]?"":"missing");b.textContent=d;b.onclick=()=>{day=d;idx=0;score=0;sel=null;done=false;menu();render()};ds.appendChild(b)})}
function norm(x){return x.toLowerCase().replace(/[’]/g,"'").replace(/[?.!,]/g,"").replace(/\s+/g," ").trim()}
function render(){if(!DATA[day]){app.innerHTML=`<div class="card empty"><h2>${day}</h2><p>현재 복원된 원본 내용이 없어 문제를 임의 생성하지 않았습니다.</p></div>`;return}
let q=DATA[day][idx];if(!q){save();app.innerHTML=`<div class="card empty"><h2>${day} 완료</h2><h1>${score} / 20</h1><button class="btn" onclick="idx=0;score=0;done=false;render()">다시 풀기</button></div>`;return}
let h=`<div class="card"><div class="row"><b class="${q.challenge?'challenge':''}">${q.challenge?'★ 도전 ':''}${idx+1} / 20</b><b>현재 ${score}점</b></div><div class="progress"><div class="bar" style="width:${idx*5}%"></div></div><div class="q">${q.q}</div>`;
if(q.type==="mc")h+=`<div class="choices">${q.opts.map((o,j)=>`<button class="choice" data-i="${j}" onclick="pick(${j})">${j+1}. ${o}</button>`).join("")}</div>`;
else h+=`<input id="answer" placeholder="영어로 입력하세요" onkeydown="if(event.key==='Enter')check()">`;
h+=`<button class="btn" onclick="check()">정답 확인</button><button class="btn" onclick="next()">다음 문제</button><div id="fb"></div></div>`;app.innerHTML=h}
function pick(j){if(done)return;sel=j;document.querySelectorAll(".choice").forEach((x,k)=>x.classList.toggle("sel",k===j))}
function check(){if(done)return;let q=DATA[day][idx],ok=false;if(q.type==="mc"){if(sel===null)return;ok=sel===q.ans;document.querySelectorAll(".choice").forEach((x,k)=>{if(k===q.ans)x.classList.add("ok");if(k===sel&&!ok)x.classList.add("no")})}else{let e=document.getElementById("answer");if(!e.value.trim())return;ok=norm(e.value)===norm(q.ans);e.style.borderColor=ok?"#4ba965":"#d45b5b"}done=true;if(ok)score++;let a=q.type==="mc"?q.opts[q.ans]:q.ans;document.getElementById("fb").innerHTML=`<div class="fb"><b>${ok?"정답입니다!":"아쉽습니다."}</b><br>정답: <b>${a}</b><br>${q.exp}</div>`}
function next(){if(!done){check();if(!done)return}idx++;sel=null;done=false;render()}menu();render();
